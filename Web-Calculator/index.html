<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Calculator with History</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="calculator-container">
    <section class="calculator" aria-label="Web Calculator">
      <!-- Calculator Header / History Toggle -->
      <div class="calculator-header">
        <button type="button" class="btn-history-toggle" id="history-toggle" aria-label="Toggle History">📜 History</button>
      </div>

      <!-- Calculator Display -->
      <div class="display-container">
        <div class="previous-operand" id="previous-operand"></div>
        <div class="current-operand" id="current-operand">0</div>
      </div>

      <!-- History Panel (Dropdown / Slide-down) -->
      <div class="history-panel hidden" id="history-panel">
        <div class="history-header">
          <span>Calculation History</span>
          <button type="button" class="btn-clear-history" id="clear-history-btn">Clear</button>
        </div>
        <ul class="history-list" id="history-list">
          <li class="history-empty">Koi history nahi hai abhi</li>
        </ul>
      </div>

      <!-- Calculator Keypad -->
      <div class="buttons-grid">
        <!-- Row 1 -->
        <button type="button" class="btn btn-action btn-clear" data-action="clear">C</button>
        <button type="button" class="btn btn-action" data-action="delete">DEL</button>
        <button type="button" class="btn btn-operator" data-operator="/" aria-label="Divide">&divide;</button>
        <button type="button" class="btn btn-operator" data-operator="*" aria-label="Multiply">&times;</button>

        <!-- Row 2 -->
        <button type="button" class="btn btn-number" data-number="7">7</button>
        <button type="button" class="btn btn-number" data-number="8">8</button>
        <button type="button" class="btn btn-number" data-number="9">9</button>
        <button type="button" class="btn btn-operator" data-operator="-" aria-label="Subtract">&minus;</button>

        <!-- Row 3 -->
        <button type="button" class="btn btn-number" data-number="4">4</button>
        <button type="button" class="btn btn-number" data-number="5">5</button>
        <button type="button" class="btn btn-number" data-number="6">6</button>
        <button type="button" class="btn btn-operator" data-operator="+" aria-label="Add">+</button>

        <!-- Row 4 -->
        <button type="button" class="btn btn-number" data-number="1">1</button>
        <button type="button" class="btn btn-number" data-number="2">2</button>
        <button type="button" class="btn btn-number" data-number="3">3</button>
        <button type="button" class="btn btn-equals" data-action="calculate" aria-label="Equals">=</button>

        <!-- Row 5 -->
        <button type="button" class="btn btn-number btn-zero" data-number="0">0</button>
        <button type="button" class="btn btn-number" data-number=".">.</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
